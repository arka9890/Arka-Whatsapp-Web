name: Build APK
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Test badge hook (Node)
        working-directory: whatsapp-web-client
        run: node tools/badge_hook.test.js

      - name: Build Release APK
        working-directory: whatsapp-web-client
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-web-apk
          path: whatsapp-web-client/app/build/outputs/apk/release/*.apk

      - name: Release untuk tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p outgoing
          cp whatsapp-web-client/app/build/outputs/apk/release/*.apk \
            "outgoing/WhatsAppWebClient-${GITHUB_REF_NAME}-android.apk"
          gh release create "$GITHUB_REF_NAME" outgoing/*.apk \
            --title "$GITHUB_REF_NAME" --generate-notes ||
          gh release upload "$GITHUB_REF_NAME" outgoing/*.apk --clobber